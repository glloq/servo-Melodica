; ===========================================================================
;  Servo Melodica — unified firmware, one source tree, many build profiles.
;  Each environment selects exactly one MIDI transport and one air module via
;  build flags; the shared core in lib/core is compiled identically for all.
;  Dependency versions are pinned for reproducible builds.
; ===========================================================================
[platformio]
default_envs = esp32_ble_servo_air
; The firmware lives in the ServoMelodica/ Arduino sketch folder (flat layout) so
; the exact same tree builds in the Arduino IDE (open ServoMelodica.ino) and here.
src_dir = ServoMelodica

; ------------------------------------------------------------------ common ----
[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DLOG_LEVEL=3
build_unflags = -std=gnu++11
lib_ldf_mode = deep+

; Shared servo/PWM libraries used by every ESP32 profile.
; Shared servo/PWM libraries used by every ESP32 profile.
; If a registry name below fails to resolve, the equivalent pinned git URL is
; given in a comment as a drop-in fallback (unambiguous but slower to fetch).
[common]
esp32_board = esp32dev
key_libs =
    adafruit/Adafruit PWM Servo Driver Library@3.0.2
    madhephaestus/ESP32Servo@3.0.6
midi_lib =
    fortyseveneffects/MIDI Library@5.0.2
; BLE-MIDI fallback: https://github.com/lathoub/Arduino-BLE-MIDI.git#2.2
; AppleMIDI fallback: https://github.com/lathoub/Arduino-AppleMIDI-Library.git#3.2.0

; ------------------------------------------------------------ BLE + servo ----
[env:esp32_ble_servo_air]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DTRANSPORT_BLE -DAIR_SERVO_VALVE
lib_deps =
    ${common.key_libs}
    ${common.midi_lib}
    lathoub/BLE-MIDI@2.2

; --------------------------------------------- BLE (NimBLE stack) + servo ----
; Lighter-memory BLE profile using the NimBLE stack (see MELODICA_BLE_NIMBLE).
[env:esp32_ble_nimble_servo_air]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DTRANSPORT_BLE -DAIR_SERVO_VALVE -DMELODICA_BLE_NIMBLE
lib_deps =
    ${common.key_libs}
    ${common.midi_lib}
    lathoub/BLE-MIDI@2.2
    h2zero/NimBLE-Arduino@1.4.2

; ----------------------------------------------------------- WiFi + servo ----
; WiFi profiles compile ALL air modules so the web UI can switch air system at
; runtime; DEFAULT_AIR_TYPE only sets the initial type. The web config UI +
; hotspot are enabled automatically (MELODICA_WEB_CONFIG via UserConfig.h).
[env:esp32_wifi_servo_air]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DTRANSPORT_WIFI_RTP -DDEFAULT_AIR_TYPE=0
lib_deps =
    ${common.key_libs}
    ${common.midi_lib}
    lathoub/AppleMIDI@3.2.0

; ------------------------------------------------------------ DIN + servo ----
[env:esp32_din_servo_air]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DTRANSPORT_DIN -DAIR_SERVO_VALVE
lib_deps =
    ${common.key_libs}

; --------------------------------------------------------- BLE + PWM blower ----
[env:esp32_ble_pwm_blower]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DTRANSPORT_BLE -DAIR_BLOWER_PWM
lib_deps =
    ${common.key_libs}
    ${common.midi_lib}
    lathoub/BLE-MIDI@2.2

; ----------------------------------------------------- WiFi + digital valve ----
[env:esp32_wifi_digital_valve]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DTRANSPORT_WIFI_RTP -DDEFAULT_AIR_TYPE=1
lib_deps =
    ${common.key_libs}
    ${common.midi_lib}
    lathoub/AppleMIDI@3.2.0

; -------------------------------------------------------- BLE + stepper bellows ----
[env:esp32_stepper_bellows]
platform = espressif32@6.9.0
board = esp32dev
build_flags = ${env.build_flags} -DTRANSPORT_BLE -DAIR_STEPPER_BELLOWS
lib_deps =
    ${common.key_libs}
    ${common.midi_lib}
    lathoub/BLE-MIDI@2.2

; ----------------------------------------------- ESP32-S3 native USB + servo ----
[env:esp32s3_usb_servo_air]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DTRANSPORT_USB -DAIR_SERVO_VALVE -DMELODICA_USB_MIDI
    -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${common.key_libs}
    ${common.midi_lib}
    adafruit/Adafruit TinyUSB Library@3.4.3

; --------------------------------------------------------- host unit tests ----
; Builds the transport-agnostic core + tests with the native toolchain.
; Run:  pio run -e native_tests && .pio/build/native_tests/program
; (or use scripts/run_native_tests.sh which drives g++ directly.)
[env:native_tests]
platform = native
build_flags =
    -std=c++17
    -DLOG_LEVEL=0
    -I$PROJECT_SRC_DIR
    -Itest
; Compile only the platform-independent core sources + the tests (never the .ino
; or the Arduino-only headers, which are #if defined(ARDUINO) guarded anyway).
build_src_filter =
    -<*>
    +<AirPolicy.cpp>
    +<InstrumentController.cpp>
    +<MidiFilter.cpp>
    +<SafetyManager.cpp>
    +<../test/>
